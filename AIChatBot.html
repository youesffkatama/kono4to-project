<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قديس بولس الرسول</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #eae6dd;
    }

    .app {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      margin: 0;
      background: #ffffff;
      border: none;
    }

    .chat-head {
      background: #1e3a5f;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
    }
    .chat-head h1 { font-size: 19px; }
    .chat-head p  { font-size: 12px; opacity: .85; }

    .chat-img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #e6c65c;
      flex-shrink: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 13px;
      line-height: 1.8;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #1e3a5f;
      color: #ffffff;
      border-bottom-left-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #f4f1ea;
      border: 1px solid #e2ddd4;
      border-bottom-right-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: #ffffff;
      border-top: 2px solid #1e3a5f;
    }
    .controls input {
      flex: 1;
      border: 1px solid #d8d2c6;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .controls input:focus { border-color: #1e3a5f; }
    .controls button {
      background: #1e3a5f;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls .clear { background: #8c2f2f; }
    .controls .clear:hover { background: #a13a3a; }
    .controls button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header class="chat-head">
      <img class="chat-img" src="/saint.png" alt="القديس بولس الرسول">
      <div>
        <h1>✝️ قديس بولس الرسول</h1>
      </div>
    </header>

    <div id="chat"></div>

    <div class="controls">
      <button class="clear" id="clearBtn">🗑 حذف المحادثة</button>
      <input id="input" placeholder="اكتب سؤالك..." autocomplete="off">
      <button id="send">إرسال</button>
    </div>

  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const clearBtn = document.getElementById('clearBtn');

    function add(t, r) {
      const d = document.createElement('div');
      d.className = 'msg ' + r;
      d.textContent = t;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const m = input.value.trim();
      if (!m) return;
      input.value = '';
      add(m, 'user');
      sendBtn.disabled = true;
      add('...', 'bot');
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: m })
      });
      const data = await res.json();
      chat.lastChild.remove();
      add(data.response, 'bot');
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.onclick = send;
    clearBtn.onclick = () => { chat.innerHTML = ''; };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
